name: CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
        
      - name: Set up Python
        run: uv python install 3.13
        
      - name: Install dependencies
        run: uv sync --all-extras --dev
        
      - name: Run tests
        run: PYTHONPATH=. uv run pytest

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          # Use IPv6 explicitly if needed by the runner, or rely on DNS/Secrets
          script: |
            cd /root/artha || git clone git@github.com:visen-vin/artha.git /root/artha
            cd /root/artha
            git pull origin master
            
            # Install/Update dependencies
            curl -LsSf https://astral.sh/uv/install.sh | sh
            /root/.local/bin/uv sync
            
            # Run database migrations (schema.sql)
            # Assuming postgres is running in docker as atlas_postgres
            docker exec -i atlas_postgres psql -U user -d quant_lab < db/schema.sql
            
            # Restart services with PM2
            pm2 startOrReload ecosystem.config.js
            pm2 save
